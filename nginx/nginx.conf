events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:8501;
    }

    upstream backend {
        server backend:8000;
    }

    ##
    ## HTTP → HTTPS redirect (ONLY job of port 80)
    ##
    server {
        listen 80;
        server_name curitibaprecos.org;
        return 301 https://$host$request_uri;
    }

    ##
    ## HTTPS server (Cloudflare → EC2)
    ##
    server {
        listen 443 ssl;
        server_name curitibaprecos.org;

        ssl_certificate     /etc/ssl/certs/cloudflare.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare.key;

        # Proxy buffers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        ##
        ## Landing page (Open Graph meta tags)
        ##
        location / {
            root /var/www/landing;
            index index.html;
        }

        ##
        ## Frontend (Streamlit)
        ##
        location /app/ {
            proxy_pass http://frontend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        ##
        ## Backend API (internal)
        ##
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        ##
        ## Explicitly block backend internals
        ##
        location ~ ^/(v1|docs|redoc|openapi\.json) {
            return 403;
        }
    }
}
